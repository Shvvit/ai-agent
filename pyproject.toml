[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wlasne-ai"
version = "0.2.0"
description = "Modularny agent AI z lokalnymi modelami, pamięcią, narzędziami i interfejsem webowym"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ollama>=0.6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "api*",
    "apps*",
    "config*",
    "core*",
    "memory*",
    "models*",
    "sandbox*",
    "security*",
    "storage*",
    "tools*",
]
exclude = [
    "tests*",
    "data*",
    "docs*",
    "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
