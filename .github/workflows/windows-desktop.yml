name: Windows desktop build

on:
  push:
    branches:
      - feature/agent-zero-integration
    paths:
      - "apps/desktop/**"
      - "api/**"
      - "patches/**"
      - "upstream/opencode"
      - ".gitmodules"
      - "tests/**"
      - "README.md"
      - "agents/**"
      - "config/**"
      - "core/**"
      - "memory/**"
      - "models/**"
      - "security/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Bun for upstream OpenCode UI
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install pinned OpenCode workspace
        working-directory: upstream/opencode
        run: bun install --frozen-lockfile
      - name: Isolate packaged desktop state for WlasneAI
        working-directory: upstream/opencode
        run: |
          git apply --check ../../patches/opencode-wlasneai-state.patch
          git apply ../../patches/opencode-wlasneai-state.patch
      - name: Build original OpenCode desktop renderer
        working-directory: upstream/opencode
        run: bun run --cwd packages/desktop build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install desktop application and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,dev]"
          python -m pip install "pyinstaller>=6.10"
      - name: Run test suite
        run: python -m pytest -q
      - name: Build Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WlasneAI --collect-all PySide6 --collect-all shiboken6 --collect-all keyring --hidden-import keyring.backends.Windows --collect-submodules agents --collect-submodules models --collect-submodules tools --collect-submodules core --collect-submodules config --collect-submodules memory --collect-submodules security apps/desktop/main.py
      - name: Build WlasneAI sidecar for the original Electron desktop
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name opencode-cli --collect-submodules agents --collect-submodules api --collect-submodules models --collect-submodules tools --collect-submodules core --collect-submodules config --collect-submodules memory --collect-submodules security --collect-submodules storage --collect-submodules sandbox apps/sidecar_cli.py
          Copy-Item dist/opencode-cli.exe upstream/opencode/packages/desktop/resources/opencode-cli.exe
          Set-Content -NoNewline -Encoding ascii upstream/opencode/packages/desktop/resources/opencode-cli.version "2.3.0"
      - name: Smoke-test packaged WlasneAI sidecar protocol
        shell: pwsh
        run: |
          $env:XDG_STATE_HOME = Join-Path $env:RUNNER_TEMP "wlasneai-sidecar-state"
          $registrationPath = Join-Path $env:XDG_STATE_HOME "opencode/service.json"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "wlasneai-sidecar.stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "wlasneai-sidecar.stderr.log"
          Remove-Item -LiteralPath $env:XDG_STATE_HOME -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "dist/opencode-cli.exe" -ArgumentList @("serve", "--service") -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          try {
            $registration = $null
            $deadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "Sidecar exited early with code $($process.ExitCode)" }
              if (Test-Path -LiteralPath $registrationPath) {
                try { $registration = Get-Content -LiteralPath $registrationPath -Raw | ConvertFrom-Json } catch { $registration = $null }
                if ($registration) { break }
              }
              Start-Sleep -Milliseconds 250
            }
            if (!$registration) { throw "Sidecar did not publish its service registration" }
            if ($registration.pid -le 0) { throw "Registration PID is invalid" }
            if ($registration.version -ne "2.3.0") { throw "Registration version does not match pinned OpenCode" }
            if (!$registration.password) { throw "Sidecar did not register its required Basic Auth password" }
            $credential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("opencode:$($registration.password)"))
            $info = Invoke-RestMethod -Uri "$($registration.url)/api/info" -Headers @{ Authorization = "Basic $credential" } -TimeoutSec 10
            if ($info.pid -ne $registration.pid -or $info.version -ne "2.3.0") { throw "Sidecar readiness response does not match registration" }
          }
          finally {
            if (!$process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
              $process.WaitForExit(10000)
            }
          }
          if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath }
      - name: Package original OpenCode Electron desktop with WlasneAI sidecar
        working-directory: upstream/opencode
        run: bun run --cwd packages/desktop pack
      - name: Smoke-test Electron startup and sidecar connection
        shell: pwsh
        run: |
          $env:WLASNEAI_STATE_HOME = Join-Path $env:RUNNER_TEMP "wlasneai-electron-state"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "wlasneai-electron-appdata"
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $env:AI_PROVIDER = "openai_compatible"
          $env:AI_MODEL = "wlasneai-e2e"
          $env:AI_BASE_URL = "http://127.0.0.1:43177/v1"
          $env:AI_API_KEY = "wlasneai-e2e-key"
          $env:WLASNEAI_E2E_PROVIDER_PORT = "43177"
          $registrationPaths = @(
            (Join-Path $env:WLASNEAI_STATE_HOME "opencode/service.json"),
            (Join-Path $env:APPDATA "ai.opencode.desktop.dev/opencode/service.json"),
            (Join-Path $env:USERPROFILE "AppData/Roaming/ai.opencode.desktop.dev/opencode/service.json")
          ) | Select-Object -Unique
          $stdoutPath = Join-Path $env:RUNNER_TEMP "wlasneai-electron.stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "wlasneai-electron.stderr.log"
          $providerStdoutPath = Join-Path $env:RUNNER_TEMP "wlasneai-provider.stdout.log"
          $providerStderrPath = Join-Path $env:RUNNER_TEMP "wlasneai-provider.stderr.log"
          Remove-Item -LiteralPath $env:WLASNEAI_STATE_HOME -Recurse -Force -ErrorAction SilentlyContinue
          $provider = Start-Process -FilePath "python" -ArgumentList @("tests/mock_openai_server.py") -PassThru -WindowStyle Hidden -RedirectStandardOutput $providerStdoutPath -RedirectStandardError $providerStderrPath
          $process = $null
          try {
            $providerReady = $false
            $providerDeadline = (Get-Date).AddSeconds(15)
            while ((Get-Date) -lt $providerDeadline) {
              if ($provider.HasExited) { throw "Local model provider exited early with code $($provider.ExitCode)" }
              try {
                $providerHealth = Invoke-RestMethod -Uri "http://127.0.0.1:43177/health" -TimeoutSec 2
                if ($providerHealth.healthy) { $providerReady = $true; break }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (!$providerReady) { throw "Local model provider did not become ready" }
            $appPath = "upstream/opencode/dist/desktop/app/OpenCode Dev.exe"
            $process = Start-Process -FilePath $appPath -ArgumentList @("--disable-gpu", "--no-sandbox", "--remote-debugging-port=9223") -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
            $registration = $null
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "Electron exited early with code $($process.ExitCode)" }
              foreach ($candidate in $registrationPaths) {
                if (Test-Path -LiteralPath $candidate) {
                  try { $registration = Get-Content -LiteralPath $candidate -Raw | ConvertFrom-Json; $registrationPath = $candidate } catch { $registration = $null }
                  if ($registration) { break }
                }
              }
              if ($registration) { break }
              Start-Sleep -Milliseconds 500
            }
            if (!$registration) { throw "Electron did not start the WlasneAI sidecar" }
            $sharedServicePath = Join-Path $env:USERPROFILE ".local/state/opencode/service.json"
            if ($registrationPath -eq $sharedServicePath) { throw "Electron used the shared OpenCode service registry" }
            if ($registration.version -ne "2.3.0") { throw "Electron connected to a sidecar with an unexpected version" }
            if (!$registration.password) { throw "Electron sidecar registration has no Basic Auth password" }
            $credential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("opencode:$($registration.password)"))
            $info = Invoke-RestMethod -Uri "$($registration.url)/api/info" -Headers @{ Authorization = "Basic $credential" } -TimeoutSec 10
            if ($info.pid -ne $registration.pid -or $info.version -ne "2.3.0") { throw "Electron sidecar readiness check failed" }
            $connected = $false
            $connectDeadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $connectDeadline -and !$connected) {
              $logRoots = @($env:APPDATA, (Join-Path $env:USERPROFILE "AppData/Roaming")) | Select-Object -Unique
              foreach ($logRoot in $logRoots) {
                if (Test-Path -LiteralPath $logRoot) {
                  $connected = [bool](Get-ChildItem -LiteralPath $logRoot -Filter "main.log" -File -Recurse -ErrorAction SilentlyContinue | Select-String -SimpleMatch "v2 CLI background service ready" -Quiet)
                  if ($connected) { break }
                }
              }
              if (!$connected) { Start-Sleep -Milliseconds 500 }
            }
            if (!$connected) { throw "Electron did not confirm its authenticated WlasneAI service connection" }
            Push-Location upstream/opencode/packages/app
            try {
              & bun ../../../../tests/electron_ui_smoke.mjs
              if ($LASTEXITCODE -ne 0) { throw "Original Electron UI did not complete a WlasneAI chat round trip" }
            }
            finally {
              Pop-Location
            }
          }
          finally {
            if ($registration -and $registration.pid -gt 0) { & taskkill.exe /PID $registration.pid /T /F | Out-Null }
            if ($process -and !$process.HasExited) { & taskkill.exe /PID $process.Id /T /F | Out-Null; $process.WaitForExit(10000) }
            if ($provider -and !$provider.HasExited) { & taskkill.exe /PID $provider.Id /T /F | Out-Null; $provider.WaitForExit(10000) }
            $logRoots = @($env:APPDATA, (Join-Path $env:USERPROFILE "AppData/Roaming")) | Select-Object -Unique
            foreach ($logRoot in $logRoots) {
              if (Test-Path -LiteralPath $logRoot) {
                Get-ChildItem -LiteralPath $logRoot -Filter "main.log" -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Get-Content -LiteralPath $_.FullName -Tail 200 }
              }
            }
            if (Test-Path -LiteralPath $stdoutPath) { Get-Content -LiteralPath $stdoutPath -Tail 100 }
            if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath -Tail 100 }
            if (Test-Path -LiteralPath $providerStdoutPath) { Get-Content -LiteralPath $providerStdoutPath -Tail 100 }
            if (Test-Path -LiteralPath $providerStderrPath) { Get-Content -LiteralPath $providerStderrPath -Tail 100 }
          }
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/WlasneAI.exe")) { throw "WlasneAI.exe was not produced" }
          if (!(Test-Path "upstream/opencode/dist/desktop/app/OpenCode Dev.exe")) { throw "OpenCode Electron desktop was not packaged" }
          if (!(Test-Path "upstream/opencode/dist/desktop/app/resources/opencode-cli.exe")) { throw "WlasneAI sidecar is missing from Electron package" }
          if ((Get-Content "upstream/opencode/dist/desktop/app/resources/opencode-cli.version" -Raw).Trim() -ne "2.3.0") { throw "Sidecar version does not match pinned OpenCode CLI" }
          Get-Item "dist/WlasneAI.exe" | Format-List Name,Length,LastWriteTime
          Get-Item "upstream/opencode/dist/desktop/app/OpenCode Dev.exe" | Format-List Name,Length,LastWriteTime
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: WlasneAI-Windows-x64
          path: dist/WlasneAI.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload OpenCode Electron desktop with WlasneAI sidecar
        uses: actions/upload-artifact@v4
        with:
          name: WlasneAI-OpenCode-Electron-Windows-x64
          path: upstream/opencode/dist/desktop/app
          if-no-files-found: error
          retention-days: 30
      - name: Publish executable to GitHub Releases
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view desktop-latest --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-latest --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WlasneAI Desktop (latest)" --notes "Automatycznie zbudowana wersja Windows x64. Pobierz WlasneAI.exe i uruchom na Windows 10/11."
            if ($LASTEXITCODE -ne 0) { throw "Nie udało się utworzyć GitHub Release" }
          }
          gh release upload desktop-latest dist/WlasneAI.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Nie udało się opublikować WlasneAI.exe w GitHub Releases" }
