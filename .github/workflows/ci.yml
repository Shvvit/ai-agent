name: CI

on:
  push:
    branches: ["master", "work/**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,web]"
      - name: Compile Python modules
        run: python -m compileall -q agents api apps config core memory models sandbox security storage tools scripts
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check frontend JavaScript syntax
        run: node --check apps/web/static/app.js
      - name: Check Linux shell scripts
        if: runner.os != 'Windows'
        run: bash -n install.sh start.sh
