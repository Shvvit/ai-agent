name: CI

on:
  push:
    branches: ["master", "work/**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,web]"
      - name: Compile Python modules
        run: python -m compileall -q agents api apps config core memory models sandbox security storage tools
      - name: Run tests
        run: python -m pytest -q
